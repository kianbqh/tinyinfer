name: tinyinfer
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_runner:
        description: Run on an explicitly provisioned CUDA self-hosted runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pytest pybind11 cmake ninja
      - name: Unified CPU backend and compiler suite
        run: bash scripts/test.sh
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda_runner
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Actual CUDA backend and compiler suite
        env:
          TINYC_CUDA: 'ON'
        run: bash scripts/test.sh
  llm-cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KV, quantization, token protocol and host ABI reference
        run: python -B -m unittest discover -s llm/tests -p 'test_*.py' -v
      - name: Native manifest parser and SHA256 vectors
        run: |
          mkdir -p "$RUNNER_TEMP/tinyinfer-v2-llm"
          g++ -std=c++17 -O2 -Wall -Wextra -Illm/src llm/tests/test_artifact.cpp -o "$RUNNER_TEMP/tinyinfer-v2-llm/test-artifact"
          "$RUNNER_TEMP/tinyinfer-v2-llm/test-artifact"
  server-autotune-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protocol, load generator and autotuner gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s server/tests -p 'test_*.py' && python -m unittest discover -s autotune/tests -p 'test_*.py'
      - name: Native CPU server and contention checks
        run: |
          cmake -S server -B build-v2-server -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-v2-server --parallel 2
          ctest --test-dir build-v2-server --output-on-failure
      - name: ThreadSanitizer producer contention and sockets
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S server -B build-v2-server-tsan -DCMAKE_BUILD_TYPE=Debug -DTI_SERVER_TSAN=ON
          cmake --build build-v2-server-tsan --parallel 2
          ctest --test-dir build-v2-server-tsan --output-on-failure
  robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build instrumented project code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B fuzz/build.py --cxx "$(command -v clang++)" --output-parent "$RUNNER_TEMP/tinyinfer-robustness"
          echo "FUZZ_RECEIPT=$(find "$RUNNER_TEMP/tinyinfer-robustness" -maxdepth 2 -name build.json -print -quit)" >> "$GITHUB_ENV"
      - name: Exact host codec and rejected-input checks
        run: |
          cmake -S backend/host_codec -B "$RUNNER_TEMP/tinyinfer-host-codec" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/tinyinfer-host-codec" --parallel 2
          python -B fuzz/check_codec.py --library "$RUNNER_TEMP/tinyinfer-host-codec/libtinyinfer_host_codec.so" > "$RUNNER_TEMP/tinyinfer-robustness/codec-parity.json"
      - name: Replay retained regressions and initial corpus
        run: python -B fuzz/replay_regressions.py --build-receipt "$FUZZ_RECEIPT" --include-seeds --output-parent "$RUNNER_TEMP/tinyinfer-robustness"
      - name: Short random-input run
        run: python -B fuzz/run_campaign.py --config fuzz/configs/ci.json --build-receipt "$FUZZ_RECEIPT" --output-parent "$RUNNER_TEMP/tinyinfer-robustness"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyinfer-robustness-${{ github.sha }}
          path: ${{ runner.temp }}/tinyinfer-robustness
          retention-days: 14
          if-no-files-found: error
